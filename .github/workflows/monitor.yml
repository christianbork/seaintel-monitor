name: Sea-Intelligence press room monitor

on:
  schedule:
    # UTC. Public repo, so Actions minutes are free. Every 5 min 06:00-18:59 UTC on
    # weekdays (07-20 Copenhagen in winter), every 30 min otherwise. GitHub may
    # start scheduled runs late or skip some under load.
    - cron: "*/5 6-18 * * 1-5"
    - cron: "17,47 0-5,19-23 * * 1-5"
    - cron: "17,47 * * * 0,6"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = normal run; test = email the latest release now, marked [TEST]"
        type: choice
        options: [check, test]
        default: test

permissions:
  contents: write           # commit state/state.json

concurrency:
  group: seaintel-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check press room
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$MODE" = "test" ]; then python monitor.py --test
          else python monitor.py; fi

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "State unchanged."
          else
            git commit -m "seaintel state $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
